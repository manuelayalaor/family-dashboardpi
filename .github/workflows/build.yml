name: Build and publish Pi images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Unzipping ${zips[0]}"
            unzip -o "${zips[0]}" -d .
          else
            echo "No zip found at repo root — assuming real folders were pushed."
          fi

      - name: Locate project root
        id: locate
        run: |
          if [ -d "family-dashboard/backend" ]; then
            echo "root=family-dashboard" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase the image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.locate.outputs.root }}/backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/family-dashboard-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.locate.outputs.root }}
          file: ${{ steps.locate.outputs.root }}/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/family-dashboard-web:latest
